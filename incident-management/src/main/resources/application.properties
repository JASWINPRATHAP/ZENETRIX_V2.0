spring.application.name=incident-management

# Database Configuration (PostgreSQL/Supabase or local Docker)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zenetrix}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Webhook Security
webhook.api.key=${WEBHOOK_API_KEY:default-secret-key-for-webhooks}

# JWT Secret
jwt.secret=${JWT_SECRET:8f7e6d5c4b3a2918273645546372819203948576a5b4c3d2e1f0}

server.port=${SERVER_PORT:8081}
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true
